name: StarSpot
options:
  bundleIdPrefix: jp.jphacks.tkb2635
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja
packages:
  StarCore:
    path: Packages/StarCore
targets:
  StarSpot:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: StarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.jphacks.tkb2635.StarSpot
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Astera
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 現在地から観測地点までの距離と経路を表示するために使います
        INFOPLIST_KEY_NSCameraUsageDescription: AR で、カメラの映像に月・惑星・星座を実際の方角に重ねて表示するために使います
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: NMJFRR7D86
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  StarSpot:
    build:
      targets:
        StarSpot: all
    test:
      targets: []
